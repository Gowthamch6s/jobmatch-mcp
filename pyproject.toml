[project]
name = "jobmatch-mcp"
version = "0.1.0"
description = "MCP server exposing job search, resume-match scoring, and application tracking as agent-callable tools."
authors = [{ name = "Gowtham Sai Chimmana", email = "gowthamch6s@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
jobmatch-mcp = "jobmatch_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
